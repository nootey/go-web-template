name: "Build Docker Image"

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - 'config/docker/**'
      - '*.md'

  workflow_call:
    inputs:
      version:
        description: "Release tag to build, e.g. v1.2.3"
        type: string
        required: true

  workflow_dispatch:

jobs:
  build:
    name: Build the API Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ inputs.version != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            nootey/go-web-template
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          flavor: |
            latest=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api,ignore-error=true

  build-client:
    name: Build the Client Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ inputs.version != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            nootey/go-web-template-client
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          flavor: |
            latest=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./build/Dockerfile.client
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client,ignore-error=true

configs:
  # Inline, so Compose fills in SERVER_PORT from .env when the stack starts.
  prometheus_local:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      rule_files:
        - /etc/prometheus/rules/*.yaml

      scrape_configs:
        - job_name: "api"
          metrics_path: /metrics
          static_configs:
            - targets: ["host.docker.internal:${SERVER_PORT:-8080}"]

        - job_name: "prometheus"
          static_configs:
            - targets: ["localhost:9090"]

services:
  prometheus:
    configs:
      - source: prometheus_local
        target: /etc/prometheus/prometheus.local.yml
    command:
      - --config.file=/etc/prometheus/prometheus.local.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  loki:
    ports:
      - "${LOKI_PORT:-3100}:3100"

  grafana:
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
